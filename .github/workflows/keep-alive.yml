name: Keep Render backends awake

# Render's free tier puts each backend to sleep after 15 minutes with no
# traffic, and the first request after that can take 30-90 seconds to
# wake it back up. Pinging it regularly keeps it warm so students get
# fast replies instead of a slow "waking up" response.

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check chatbot backend health
        run: curl --fail --show-error --silent --max-time 60 https://olinda-ai-backend-chatbot.onrender.com/health

      - name: Check dashboard backend health
        run: curl --fail --show-error --silent --max-time 60 https://olinda-ai-backend-dashboard.onrender.com/health
