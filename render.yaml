services:
  - type: web
    name: olinda-chatbot-backend
    runtime: python
    rootDir: backend/chatbot_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://hobartcollege.education.tas.edu.au,https://olinda.rafistacks.dev,https://portal-olinda.rafistacks.dev
      - key: UNANSWERED_LOG_ENABLED
        value: "true"
      - key: CHAT_REQUESTS_PER_MINUTE
        value: "15"
      - key: CHAT_DAILY_REQUEST_LIMIT
        value: "200"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIMENSIONS
        value: "768"
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: TOP_K
        value: "4"
      - key: RAG_TOP_K
        value: "3"
      - key: MAX_HISTORY_MESSAGES
        value: "8"
      - key: MAX_RECENT_MESSAGES
        value: "4"
      - key: MAX_SUMMARY_TOKENS
        value: "400"
  - type: web
    name: olinda-dashboard-backend
    runtime: python
    rootDir: backend/dashboard_server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://portal-olinda.rafistacks.dev
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STAFF_USERS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIMENSIONS
        value: "768"
