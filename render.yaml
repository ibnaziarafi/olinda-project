services:
  - type: web
    name: olinda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: EMBED_MODEL
        value: gemini-embedding-001
      - key: EMBED_DIMENSIONS
        value: "768"
      - key: CONFIDENCE_THRESHOLD
        value: "0.65"
      - key: TOP_K
        value: "4"
